<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#121212">
<link rel="icon" href="icon.svg">
<script src="config.js?v=5c1ef1a5"></script>
<script src="data.js?v=51fbe7e1"></script>
<title>ParveenBox</title>
<style>
/* Written to work on older TV browsers too: no aspect-ratio, no flex gap. CSS grid only inside @supports, flex-wrap otherwise */
/* Look: DESIGN.md (Spotify-style dark + one green accent), with its TV rules: big text, clear focus, safe margins */
:root{--bg:#121212;--card:#181818;--card2:#1f1f1f;--card3:#2a2a2a;--tx:#fff;--mut:#b3b3b3;--ac:#1ed760;--ok:#1ed760;--warn:#ffa42b;--ln:#4d4d4d;--sh:0 8px 24px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:90px}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}a{color:inherit;text-decoration:none}
/* the remote's focus must be obvious from the sofa: a thick white ring, and buttons turn white */
a:focus,button:focus,select:focus,input:focus,.ep:focus,.chip:focus{outline:4px solid #fff;outline-offset:3px}
.tile:focus,.tile:hover{box-shadow:0 0 0 5px #fff,var(--sh);background:var(--card3)}
.btn:focus,.chip:focus,#sbtn:focus,.btn.pri:focus{background:#fff;border-color:#fff;color:#000}
header{position:sticky;top:0;z-index:5;background:rgba(18,18,18,.97);padding:12px 16px;display:flex;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;white-space:nowrap;margin-right:14px}.logo b{color:var(--ac)}
.sbox{flex:1;display:flex;max-width:640px;margin:0 auto;min-width:0}
#q{flex:1;min-width:0;width:100%;background:var(--card2);border:0;box-shadow:inset 0 0 0 1px #7c7c7c;border-radius:9999px 0 0 9999px;padding:10px 20px;outline:none}
#q:focus{box-shadow:inset 0 0 0 3px #fff}
#go{background:var(--card2);border:0;box-shadow:inset 0 0 0 1px #7c7c7c;border-radius:0 9999px 9999px 0;padding:0 20px;cursor:pointer}
/* the search box stays hidden until the Search button is pressed, so the TV keyboard never pops up by itself */
.sbox{display:none}.sbox.open{display:flex}
#sbtn{margin-left:auto;background:var(--card2);border:0;border-radius:9999px;padding:9px 22px;cursor:pointer;max-width:50%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
#sbtn.hide{display:none}
.hero{display:flex;align-items:flex-start;margin-bottom:8px}.hero img{width:420px;max-width:40%;border-radius:8px;margin-right:24px;background:var(--card2);box-shadow:var(--sh)}
.hero .btn{font-size:1.1em;padding:12px 26px}
main{max-width:1500px;margin:0 auto;padding:16px}
h2.sec{font-size:1.5em;font-weight:700;margin:24px 0 10px}h2.sec a:hover,h2.sec a:focus{color:var(--ac)}.more{color:var(--mut);font-size:.6em;font-weight:400;margin-left:8px}
/* padding keeps the focus ring inside the scrolling row; no scrollbar: the remote scrolls the row */
.row{display:flex;overflow-x:auto;overflow-y:hidden;padding:10px 10px 16px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}.row .tile{flex:0 0 190px;margin-right:16px}
.grid{display:flex;flex-wrap:wrap;padding:8px}.grid .tile{width:180px;margin:0 16px 16px 0}
@supports (display:grid){.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));grid-gap:16px}.grid .tile{width:auto;margin:0}}
/* no transform on hover/focus: inside a scrolling row it made the row grow a scrollbar and the page jump */
.tile{display:block;background:var(--card);border-radius:8px;overflow:hidden}
.th{position:relative;padding-top:62.5%;background:var(--card2)}.th img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}
.badge.off{left:6px;right:auto;bottom:auto;top:6px;background:var(--ac);color:#000;font-weight:700}
.badge{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);font-size:.8em;font-weight:700;padding:2px 8px;border-radius:9999px}
.tile .t{padding:10px 12px 12px}.n{font-weight:700;font-size:1em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m{color:var(--mut);font-size:.85em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.m.note2{color:var(--warn)}
.bar{height:4px;background:var(--ln)}.bar i{display:block;height:100%;background:var(--ac)}
.sk{background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:8px;height:170px;flex:0 0 190px;margin-right:16px}
@keyframes sh{to{background-position:-200% 0}}
.note{color:var(--mut);font-size:.9em;margin:6px 0}
.err{text-align:center;padding:50px 16px;color:var(--mut)}.err h3{color:var(--tx);margin-bottom:6px}
.btn{background:var(--card2);border:0;border-radius:9999px;padding:9px 18px;cursor:pointer;display:inline-block;margin-right:10px;margin-top:8px;font-weight:700}.btn:hover{background:var(--card3)}.btn.pri{background:var(--ac);color:#000}
.chips{display:flex;flex-wrap:wrap}
.chip{background:var(--card2);border:0;border-radius:9999px;padding:7px 18px;cursor:pointer;white-space:nowrap;margin:0 10px 10px 0;display:inline-block;font-weight:700}
.chip:hover{background:var(--card3)}.chip.on{background:var(--ac);color:#000}
.ctrls{display:flex;flex-wrap:wrap;align-items:center;margin:6px 0 14px}
.ctrls label{color:var(--mut);font-size:.9em;margin-right:8px}
.ctrls select{background:var(--card2);border:0;border-radius:9999px;padding:8px 16px;margin-right:18px;margin-bottom:8px}
.ctrls .grp{display:flex;align-items:center;flex-wrap:wrap;margin-right:10px}.ctrls .pair{display:inline-flex;align-items:center;white-space:nowrap}
.watch{display:flex;align-items:flex-start}.watch>div:first-child{flex:1;min-width:0;margin-right:18px}.watch .eps{flex:0 0 380px}
.watch.theater{display:block}.watch.theater>div:first-child{margin-right:0}.watch.theater .eps{margin-top:18px}
@media(max-width:880px){.watch{display:block}.watch>div:first-child{margin-right:0}.watch .eps{margin-top:18px}}
@media(max-width:520px){.logo{font-size:18px;margin-right:8px}header{padding:10px}#q{padding:9px 12px}}
.player{position:relative;padding-top:56.25%;background:#000;border-radius:8px;overflow:hidden}
.player iframe,.player #yt{position:absolute;top:0;left:0;width:100%;height:100%}
h1{font-size:1.6em;font-weight:700;margin:14px 0 4px}.sub{color:var(--mut)}.ctl{margin-top:8px}
.eps{background:var(--card);border-radius:8px;max-height:75vh;overflow:auto}.theater .eps{max-height:none}
.eps h3{padding:12px 16px;position:sticky;top:0;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.4);font-size:1em;z-index:1}
.ep{display:flex;padding:10px 14px;cursor:pointer;align-items:center}.ep:hover,.ep:focus{background:var(--card3)}.ep.cur{background:#1d2e23}
.ep img{width:112px;height:63px;object-fit:cover;border-radius:6px;flex:none;background:var(--card2);margin-right:12px}
.ep .no{color:var(--mut);font-size:.85em;font-weight:700}.ep .tt{font-size:.95em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep.seen .tt{color:var(--mut)}.ep.seen .no:after{content:" \2713 watched";color:var(--ok)}
.back{background:none;border:0;color:var(--mut);cursor:pointer;margin-bottom:10px;font-size:1em;font-weight:700;border-radius:9999px;padding:4px 10px}
#toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:var(--card3);box-shadow:var(--sh);padding:12px 22px;border-radius:9999px;display:none;z-index:20;max-width:90vw}
main{padding-bottom:160px}
/* search results: the original upload highlighted, other uploads below */
.grp{padding-top:8px;margin-top:12px}
.orig{display:flex;align-items:center;background:var(--card);border-radius:8px;padding:12px;max-width:980px;box-shadow:var(--sh)}
.orig:focus,.orig:hover{box-shadow:0 0 0 5px #fff,var(--sh);background:var(--card3)}
.orig img{width:320px;height:180px;object-fit:cover;border-radius:6px;margin-right:18px;flex:none;background:var(--card2)}
.orig .ot{font-size:1.2em;font-weight:700;margin:4px 0}
.tag{display:inline-block;background:var(--ac);color:#000;font-weight:700;font-size:.8em;padding:2px 10px;border-radius:9999px}
.tag.fav{background:#f5c518;color:#000}
.oth{color:var(--mut);font-weight:700;margin:14px 0 4px}
@media(max-width:700px){.orig{display:block}.orig img{width:100%;height:auto;margin:0 0 8px}}
/* TV (1920x1080, watched from the sofa): text 28px and up, big posters, 5% safe margins against overscan */
@media(min-width:1600px){
  html{scroll-padding-top:140px}
  body{font-size:28px}
  header{padding:22px 96px}.logo{font-size:44px;margin-right:28px}#sbtn{padding:12px 32px}
  main{max-width:none;padding:24px 96px 200px}
  .row .tile,.sk{flex-basis:300px;margin-right:24px}.sk{height:290px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));grid-gap:24px}
  .btn{padding:14px 30px;margin-right:16px}.hero .btn{padding:18px 40px}.chip{padding:12px 28px;margin:0 16px 16px 0}
  .ctrls select{padding:12px 24px}
  .watch .eps{flex-basis:600px}.ep{padding:14px 18px}.ep img{width:192px;height:108px;margin-right:18px}
  .hero img{width:640px}
  .orig img{width:480px;height:270px}
  .tile:focus,.orig:focus{box-shadow:0 0 0 6px #fff,var(--sh)}
  a:focus,button:focus,select:focus,input:focus,.ep:focus,.chip:focus{outline-width:5px;outline-offset:4px}
}
</style>
</head>
<body>
<header>
  <a class="logo" href="#/">Parveen<b>Box</b></a>
  <button id="sbtn" type="button">&#128269; Search</button>
  <form class="sbox" id="sf"><input id="q" type="search" tabindex="-1" placeholder="Search any Hindi or Urdu serial…" autocomplete="off"><button id="go" type="submit" tabindex="-1" aria-label="Search">&#128269;</button></form>
</header>
<main id="app"></main>
<div id="toast"></div>

<script src="app.js?v=ab975d6a"></script>
</body>
</html>
