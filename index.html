<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="icon.svg">
<script src="config.js?v=5c1ef1a5"></script>
<script src="data.js?v=0435782f"></script>
<title>ParveenBox</title>
<style>
/* Written to work on older TV browsers too: no aspect-ratio, no flex gap. CSS grid only inside @supports, flex-wrap otherwise */
:root{--bg:#0f1115;--card:#181b22;--card2:#1f232c;--tx:#eef0f4;--mut:#8b93a3;--ac:#ff4d5a;--ok:#35c47c;--warn:#f0b13a;--ln:#2a2f3a}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:90px}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}a{color:inherit;text-decoration:none}
a:focus,button:focus,select:focus,input:focus,.ep:focus,.chip:focus{outline:3px solid #fff;outline-offset:2px}.tile:focus,.tile:hover{box-shadow:0 0 0 3px #fff}
header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.96);padding:12px 16px;display:flex;align-items:center;border-bottom:1px solid #22262f}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;white-space:nowrap;margin-right:14px}.logo b{color:var(--ac)}
.sbox{flex:1;display:flex;max-width:640px;margin:0 auto;min-width:0}
#q{flex:1;min-width:0;width:100%;background:var(--card);border:1px solid var(--ln);border-radius:22px 0 0 22px;padding:10px 18px;outline:none}
#q:focus{border-color:var(--ac)}
#go{background:var(--card2);border:1px solid var(--ln);border-left:0;border-radius:0 22px 22px 0;padding:0 18px;cursor:pointer}
/* the search box stays hidden until the Search button is pressed, so the TV keyboard never pops up by itself */
.sbox{display:none}.sbox.open{display:flex}
#sbtn{margin-left:auto;background:var(--card);border:1px solid var(--ln);border-radius:22px;padding:9px 20px;cursor:pointer;max-width:50%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sbtn.hide{display:none}
.hero{display:flex;align-items:flex-start;margin-bottom:8px}.hero img{width:420px;max-width:40%;border-radius:12px;margin-right:24px;background:#222}
.hero .btn{font-size:1.1em;padding:12px 22px}
main{max-width:1500px;margin:0 auto;padding:16px}
h2.sec{font-size:1.2em;margin:22px 0 10px}h2.sec a:hover{color:var(--ac)}.more{color:var(--mut);font-size:.75em;font-weight:400;margin-left:6px}
.row{display:flex;overflow-x:auto;overflow-y:hidden;padding:6px 6px 12px}.row .tile{flex:0 0 190px;margin-right:14px}
.grid{display:flex;flex-wrap:wrap}.grid .tile{width:180px;margin:0 14px 14px 0}
@supports (display:grid){.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));grid-gap:14px}.grid .tile{width:auto;margin:0}}
/* no transform on hover/focus: inside a scrolling row it made the row grow a scrollbar and the page jump */
.tile{display:block;background:var(--card);border-radius:12px;overflow:hidden}
.th{position:relative;padding-top:62.5%;background:#222}.th img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}
.badge.off{left:6px;right:auto;bottom:auto;top:6px;background:#143a28;color:#35c47c;font-weight:700}
.badge{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.78);font-size:.8em;padding:2px 7px;border-radius:6px}
.tile .t{padding:9px 11px 12px}.n{font-weight:600;font-size:.93em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m{color:var(--mut);font-size:.8em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.m.note2{color:var(--warn)}
.bar{height:3px;background:var(--ln)}.bar i{display:block;height:100%;background:var(--ac)}
.sk{background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:12px;height:170px;flex:0 0 190px;margin-right:14px}
@keyframes sh{to{background-position:-200% 0}}
.note{color:var(--mut);font-size:.87em;margin:6px 0}
.err{text-align:center;padding:50px 16px;color:var(--mut)}.err h3{color:var(--tx);margin-bottom:6px}
.fix{background:#1b2230;border:1px solid #2c3a55;border-radius:10px;padding:10px 14px;margin:8px 0}
.btn{background:var(--card2);border:1px solid var(--ln);border-radius:10px;padding:8px 14px;cursor:pointer;display:inline-block;margin-right:8px;margin-top:6px}.btn:hover{filter:brightness(1.2)}.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.chips{display:flex;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:6px 16px;cursor:pointer;white-space:nowrap;margin:0 8px 8px 0;display:inline-block}
.chip:hover{border-color:var(--ac)}.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.ctrls{display:flex;flex-wrap:wrap;align-items:center;margin:6px 0 14px}
.ctrls label{color:var(--mut);font-size:.85em;margin-right:6px}
.ctrls select{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;margin-right:18px;margin-bottom:8px}
.ctrls .grp{display:flex;align-items:center;flex-wrap:wrap;margin-right:10px}.ctrls .pair{display:inline-flex;align-items:center;white-space:nowrap}
.where{margin-top:26px}
.pl{display:flex;align-items:center;background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0;flex-wrap:wrap}
.pl .nm{font-weight:600}.pl .sub{color:var(--mut);font-size:.85em}.pl .gr{flex:1;min-width:200px}
.pill{font-size:.78em;font-weight:700;padding:3px 9px;border-radius:12px;white-space:nowrap;margin-right:10px}
.free{background:#143a28;color:var(--ok)}.paid{background:#3e2f10;color:var(--warn)}.unk{background:#2a2f3a;color:var(--mut)}
.watch{display:flex;align-items:flex-start}.watch>div:first-child{flex:1;min-width:0;margin-right:18px}.watch .eps{flex:0 0 380px}
.watch.theater{display:block}.watch.theater>div:first-child{margin-right:0}.watch.theater .eps{margin-top:18px}
@media(max-width:880px){.watch{display:block}.watch>div:first-child{margin-right:0}.watch .eps{margin-top:18px}}
@media(max-width:520px){.logo{font-size:18px;margin-right:8px}header{padding:10px}#q{padding:9px 12px}}
.player{position:relative;padding-top:56.25%;background:#000;border-radius:12px;overflow:hidden}
.player iframe,.player #yt{position:absolute;top:0;left:0;width:100%;height:100%}
h1{font-size:1.3em;margin:14px 0 4px}.sub{color:var(--mut)}.ctl{margin-top:8px}
.eps{background:var(--card);border-radius:12px;max-height:75vh;overflow:auto}.theater .eps{max-height:none}
.eps h3{padding:12px 14px;position:sticky;top:0;background:var(--card);border-bottom:1px solid #22262f;font-size:.93em}
.ep{display:flex;padding:9px 12px;cursor:pointer;align-items:center}.ep:hover{background:var(--card2)}.ep.cur{background:#2a1d20}
.ep img{width:112px;height:63px;object-fit:cover;border-radius:6px;flex:none;background:#222;margin-right:10px}
.ep .no{color:var(--mut);font-size:.8em}.ep .tt{font-size:.87em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep.seen .tt{color:var(--mut)}.ep.seen .no:after{content:" \2713 watched";color:var(--ok)}
.back{background:none;border:0;color:var(--mut);cursor:pointer;margin-bottom:10px;font-size:1em}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2a2f3a;padding:10px 18px;border-radius:10px;display:none;z-index:20;max-width:90vw}
@media(min-width:1600px){
  body{font-size:20px}.logo{font-size:30px}
  .row .tile,.sk{flex-basis:250px}.grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  .watch .eps{flex-basis:460px}.ep img{width:150px;height:84px}
}
</style>
</head>
<body>
<header>
  <a class="logo" href="#/">Parveen<b>Box</b></a>
  <button id="sbtn" type="button">&#128269; Search</button>
  <form class="sbox" id="sf"><input id="q" type="search" tabindex="-1" placeholder="Search any Hindi or Urdu serial…" autocomplete="off"><button id="go" type="submit" tabindex="-1" aria-label="Search">&#128269;</button></form>
</header>
<main id="app"></main>
<div id="toast"></div>

<script src="app.js?v=439e5054"></script>
</body>
</html>
