<!doctype html>
<html><head><meta charset="utf-8"><title>ParveenBox</title>
<style>body{margin:0;background:#121212;color:#fff;font:40px Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh}b{color:#1ed760}#m{display:none;font-size:32px;color:#b3b3b3;margin-top:30px;text-align:center;line-height:1.5}</style>
</head><body><div>Parveen<b>Box</b></div><div id="m">No internet. Check the Wi-Fi.<br>ParveenBox opens by itself when the internet is back.</div>
<script>
/* open the site only once it answers; an image needs no cross-site permission, so this test cannot fail by itself */
(function check() {
  var img = new Image();
  img.onload = function () { location.replace('https://tanzeb.github.io/parveenbox/?app=2.10.1'); };
  img.onerror = function () { document.getElementById('m').style.display = 'block'; setTimeout(check, 10000); };
  img.src = 'https://tanzeb.github.io/parveenbox/icon.png?t=' + Date.now();
})();
</script>
</body></html>
